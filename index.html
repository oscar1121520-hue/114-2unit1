<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國小複習試卷導覽系統</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #eef2f3; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #34495e; }
        select { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 8px; font-size: 16px; background-color: #fff; cursor: pointer; }
        select:focus { border-color: #3498db; outline: none; box-shadow: 0 0 5px rgba(52,152,219,0.3); }
        button { width: 100%; padding: 14px; background-color: #3498db; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 10px; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #2980b9; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h2>📚 複習試卷導覽</h2>
    
    <div class="form-group">
        <label>第一步：選擇年級</label>
        <select id="gradeSelect">
            <option value="">-- 請選擇年級 --</option>
            <option value="3">三年級 (三下)</option>
            <option value="5">五年級 (五下)</option>
        </select>
    </div>

    <div class="form-group">
        <label>第二步：選擇科目</label>
        <select id="subjectSelect">
            <option value="">-- 請先選擇年級 --</option>
        </select>
    </div>

    <div class="form-group">
        <label>第三步：選擇章節</label>
        <select id="chapterSelect">
            <option value="">-- 請先選擇科目 --</option>
        </select>
    </div>

    <button id="okBtn" disabled>確定進入練習 (OK)</button>
</div>

<script>
    const data = {
        "3": {
            "國語": [
                {n:"三下國語L7", u:"https://forms.gle/MFCVBnoVAM1PiUZ37"},
                {n:"三下國語L8", u:"https://forms.gle/EvRHquD26kneMYCM6"},
                {n:"三下國語L9", u:"https://forms.gle/LwqK8pxPBoNnhTuZ7"},
                {n:"三下國語L10", u:"https://forms.gle/EabqrwQW2KUVTgkJA"},
                {n:"三下國語L11", u:"https://forms.gle/nWjm9UWwE1dUo2Bo9"},
                {n:"三下國語L12", u:"https://forms.gle/4mAcfxjFaYaa5ZoLA"}
            ],
            "自然": [
                {n:"三下自然3-1", u:"https://forms.gle/iokuWRXJ8rzpXi2J9"},
                {n:"三下自然3-2", u:"https://forms.gle/SQLo1CFhuikeXz1w9"},
                {n:"三下自然3-3", u:"https://forms.gle/ac3YZn5XGgnKKFcv8"},
                {n:"三下自然4-1", u:"https://forms.gle/zmR6W4myXDS5xMrV6"},
                {n:"三下自然4-2", u:"https://forms.gle/hVTrDjSJS7mKrruS8"},
                {n:"三下自然4-3", u:"https://forms.gle/L2dLdZ5Wgh1yrcUA7"}
            ],
            "社會": [
                {n:"三下社會3-1", u:"https://forms.gle/JpAyCn1jo9n18t3Y8"},
                {n:"三下社會3-2", u:"https://forms.gle/cpPTAvbekUBWnGsDA"},
                {n:"三下社會4-1", u:"https://forms.gle/MSVXtzvWRe2rLR726"},
                {n:"三下社會4-2", u:"https://forms.gle/oCTt9VEe31io9Jcc7"},
                {n:"三下社會4-3", u:"https://forms.gle/QfomkQvEZqtowa3k7"}
            ]
        },
        "5": {
            "國語": [
                {n:"五下國語L7", u:"https://forms.gle/bDX5Mp3TcxxeeyyP6"},
                {n:"五下國語L8", u:"https://forms.gle/iq4wuYXh1t2q3RSL7"},
                {n:"五下國語L9", u:"https://forms.gle/1Rv1MMNQF79bPM3U7"},
                {n:"五下國語L10", u:"https://forms.gle/wfLYQzLpq9JpMieTA"},
                {n:"五下國語L11", u:"https://forms.gle/ujwuBakHYbQP8tRD9"},
                {n:"五下國語L12", u:"https://forms.gle/KoXxoS3QUixTwfsu5"}
            ],
            "自然": [
                {n:"五下自然3-1", u:"https://forms.gle/t6W5iVqAzjsPWnxM8"},
                {n:"五下自然3-2", u:"https://forms.gle/qipDrt5Ej5LkfsBD8"},
                {n:"五下自然3-3", u:"https://forms.gle/umGeioGyzMqpgnW47"},
                {n:"五下自然4-1", u:"https://forms.gle/RvEPhfVfx32kQ4fH9"},
                {n:"五下自然4-2", u:"https://forms.gle/1je5jBUcbyNjb8yv8"},
                {n:"五下自然4-3", u:"https://forms.gle/bu2mJGiWvwLFb3Kb9"}
            ],
            "社會": [
                {n:"五下社會3-1", u:"https://forms.gle/vCaMeVUK57EppURV7"},
                {n:"五下社會3-2", u:"https://forms.gle/zGcT2ouQCPx9GYWi9"},
                {n:"五下社會4-1", u:"https://forms.gle/udGgv3bHC98NCdZX9"},
                {n:"五下社會4-2", u:"https://forms.gle/4g8oBshxJ49cSRQ3A"},
                {n:"五下社會4-3", u:"https://forms.gle/et4fGAyAiMiyYDuDA"}
            ]
        }
    };

    const gSel = document.getElementById('gradeSelect');
    const sSel = document.getElementById('subjectSelect');
    const cSel = document.getElementById('chapterSelect');
    const btn = document.getElementById('okBtn');

    gSel.onchange = function() {
        sSel.innerHTML = '<option value="">-- 選擇科目 --</option>';
        cSel.innerHTML = '<option value="">-- 請先選擇科目 --</option>';
        btn.disabled = true;
        if (this.value !== "") {
            Object.keys(data[this.value]).forEach(s => {
                let opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                sSel.appendChild(opt);
            });
        }
    };

    sSel.onchange = function() {
        cSel.innerHTML = '<option value="">-- 選擇章節 --</option>';
        btn.disabled = true;
        if (this.value !== "") {
            data[gSel.value][this.value].forEach(item => {
                let opt = document.createElement('option');
                opt.value = item.u;
                opt.textContent = item.n;
                cSel.appendChild(opt);
            });
        }
    };

    cSel.onchange = function() {
        btn.disabled = (this.value === "");
    };

    btn.onclick = function() {
        if (cSel.value) window.open(cSel.value, '_blank');
    };
</script>

</body>
</html>
